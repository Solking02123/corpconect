name: Build Executable for Windows 7

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2019

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller<6.0" pywebview flask

      - name: Install Requirements (No Cache)
        run: |
          if (Test-Path requirements.txt) { pip install --no-input -r requirements.txt }
        continue-on-error: true

      - name: Build EXE
        run: |
          pyinstaller --noconsole --onefile run_python.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Desktop-App-Win7
          path: dist/*.exe
